name: Monitor de Chamamentos

on:
  workflow_dispatch:

  schedule:
    # Todos os dias às 18:00 (Horário de Brasília = 21:00 UTC)
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install chromium

      - name: Executar monitor
        env:
          LOOKER_URL: ${{ secrets.LOOKER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      - name: Verificar alterações
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Salvar alterações
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add data/ultimo_numero.json
          git commit -m "Atualiza último número monitorado"
          git push